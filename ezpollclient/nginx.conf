server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router is configured with mode: 'history', so unknown paths must
    # fall back to index.html and let the client-side router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's content-hashed JS/CSS
    # filenames. Each deploy replaces dist/ wholesale (old hashed files are
    # gone), so an index.html cached from a previous deploy would reference
    # assets that no longer exist. Keep it always revalidated while letting
    # the hashed, immutable assets themselves be cached normally.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
