# compose-launcher config for EZPoll (https://github.com/Nate314/EZPoll)
port CLIENT_PORT 8080
port SOCKET_PORT 3000
port API_PORT 5000
port MYSQL_PORT 3307
port PHPMYADMIN_PORT 8083

url EZPoll client: http://localhost:{CLIENT_PORT}
url phpMyAdmin:    http://localhost:{PHPMYADMIN_PORT}
url Socket.io:     http://localhost:{SOCKET_PORT}  (used by the client)
url Python API:    http://127.0.0.1:{API_PORT}  (needs the internal secret header)
url MySQL:         127.0.0.1:{MYSQL_PORT}

note ALLOWED_ORIGINS|PUBLIC_SOCKET_URL Note: .env sets ALLOWED_ORIGINS or PUBLIC_SOCKET_URL explicitly. They must match the ports above.
