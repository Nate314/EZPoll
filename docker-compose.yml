services:

    client:
        build:
            context: ./ezpollclient
        ports:
            - "${CLIENT_PORT:-8080}:8080"
        environment:
            PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:${SOCKET_PORT:-3000}}
        depends_on:
            - socket-server
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    socket-server:
        build:
            context: ./ezpollsocketserver
        ports:
            - "${SOCKET_PORT:-3000}:3000"
        environment:
            API_URL: http://python-api:5000/api
            INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-internal-secret-change-me}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${CLIENT_PORT:-8080},http://127.0.0.1:${CLIENT_PORT:-8080}}
        depends_on:
            - python-api
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    python-api:
        build:
            context: ./server
        ports:
            # Only the socket server needs this API (over the compose network);
            # the host binding is loopback-only for local debugging.
            - "127.0.0.1:${API_PORT:-5000}:5000"
        environment:
            DB_HOST: mysql-db
            DB_PORT: 3306
            DB_NAME: EZPoll
            DB_USER: ${EZPOLL_DB_USER:-ezpoll_app}
            DB_PASSWORD: ${EZPOLL_DB_PASSWORD:-dev-only-app-password-change-me}
            INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-internal-secret-change-me}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${CLIENT_PORT:-8080},http://127.0.0.1:${CLIENT_PORT:-8080}}
        depends_on:
            mysql-db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    mysql-db:
        image: mysql:8.4
        ports:
            # Host port 3307 (not the default 3306) to avoid clashing with any
            # MySQL already running on the host, and loopback-only. Other
            # services reach MySQL over the compose network at mysql-db:3306.
            - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
        working_dir: /docker-entrypoint-initdb.d
        volumes:
            - ./db:/docker-entrypoint-initdb.d:ro
        environment:
            # root is only reachable from inside this container (image default is '%').
            MYSQL_ROOT_HOST: localhost
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root-password-change-me}
            EZPOLL_DB_USER: ${EZPOLL_DB_USER:-ezpoll_app}
            EZPOLL_DB_PASSWORD: ${EZPOLL_DB_PASSWORD:-dev-only-app-password-change-me}
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
        security_opt:
            - no-new-privileges:true

    phpmyadmin:
        image: phpmyadmin:5.2-apache
        ports:
            - "127.0.0.1:${PHPMYADMIN_PORT:-8083}:80"
        environment:
            # Cookie auth: no stored credentials, users must log in.
            # Log in with EZPOLL_DB_USER / EZPOLL_DB_PASSWORD (root is not
            # reachable over the network).
            PMA_HOST: mysql-db
            PMA_PORT: 3306
            PMA_ARBITRARY: 0
        depends_on:
            mysql-db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
