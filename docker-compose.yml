services:

    client:
        build:
            context: ./ezpollclient
        ports:
            - 8080:80
        depends_on:
            - socket-server

    socket-server:
        build:
            context: ./ezpollsocketserver
        ports:
            - 3000:3000
        depends_on:
            - python-api

    python-api:
        build:
            context: ./server
        ports:
            - 5000:5000
        depends_on:
            mysql-db:
                condition: service_healthy

    mysql-db:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        ports:
            # Host port 3307 (not the default 3306) to avoid clashing with any
            # MySQL already running/listening on the host. Only needed for
            # connecting an external DB client; other services reach MySQL
            # over the compose network at mysql-db:3306.
            - 3307:3306
        working_dir: /docker-entrypoint-initdb.d
        volumes:
            - ./db:/docker-entrypoint-initdb.d
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_ROOT_HOST: '%'
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 20
